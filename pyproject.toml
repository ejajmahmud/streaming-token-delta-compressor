[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-token-delta-compressor"
version = "0.1.0"
description = "Real-time prefix dictionary and delta compression engine for high-frequency token streams over constrained networks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
streaming-token-delta-compressor = "streaming_token_delta_compressor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["streaming_token_delta_compressor*"]
